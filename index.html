<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IELTS Study Log</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#20242b;background:#f4f6f8}*{box-sizing:border-box}body{margin:0;padding:30px 16px}
    main{max-width:780px;margin:auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 30px #17203312}h1{font-size:25px;margin:0 0 8px}
    .sub{color:#667085;margin:0 0 22px}.section{border-top:1px solid #eaecf0;padding-top:18px;margin-top:22px}h2{font-size:16px;margin:0 0 14px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.wide{grid-column:1/-1}label{display:block;font-size:13px;font-weight:650;margin:0 0 6px}
    input,select,textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px 11px;font:inherit;background:#fff}textarea{min-height:72px;resize:vertical}
    .hint{font-size:12px;color:#667085;line-height:1.5;margin:6px 0 0}.skill-panel{display:none;border:0;padding:0;margin:0}.skill-panel.active{display:block}
    button{border:0;border-radius:8px;padding:11px 16px;background:#1769e0;color:#fff;font-weight:700;font-size:14px;cursor:pointer}button:disabled{opacity:.6;cursor:wait}
    .actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}.secondary{background:#475467}.status{white-space:pre-wrap;border-radius:8px;padding:12px 14px;margin:0 0 18px;display:none;line-height:1.5}
    .status.show{display:block}.ok{background:#ecfdf3;color:#067647}.err{background:#fef3f2;color:#b42318}.info{background:#eff8ff;color:#175cd3}
    @media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:20px}}
  </style>
</head>
<body><main>
  <h1>IELTS Study Log</h1>
  <p class="sub">Chọn kỹ năng, điền mẫu buổi học rồi submit. Log được lưu trong repo và Git tự commit/push.</p>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <section>
    <h2>Kết nối repository local</h2>
    <div class="grid">
      <div class="field wide"><label for="repoPath">Đường dẫn tới repo đã clone</label><input id="repoPath" placeholder="Ví dụ: C:\\Users\\you\\ielts-learning-journal"></div>
    </div>
    <div class="actions"><button id="saveConfig" class="secondary" type="button">Lưu repo</button><span class="hint">Chỉ cần chọn một lần trên máy này.</span></div>
  </section>

  <form id="logForm">
    <section class="section"><h2>Thông tin buổi học</h2><div class="grid">
      <div class="field"><label for="studyDate">Ngày học</label><input id="studyDate" type="date" required></div>
      <div class="field"><label for="source">Nguồn học</label><input id="source" list="sources" value="Study4" required><datalist id="sources"><option>Study4</option><option>Cambridge IELTS</option><option>IELTS Liz</option><option>Khác</option></datalist></div>
      <div class="field"><label for="skill">Kỹ năng</label><select id="skill"><option>Listening</option><option>Reading</option><option>Writing</option><option>Speaking</option></select></div>
      <div class="field"><label for="lesson">Tên bài / bài thi</label><input id="lesson" placeholder="Ví dụ: Collection 1 — Test 1" required></div>
      <div class="field"><label for="minutes">Thời lượng (phút)</label><input id="minutes" type="number" min="1" max="1440" value="30" required></div>
    </div></section>

    <section class="section"><h2 id="templateTitle">Mẫu Listening</h2>
      <div class="skill-panel active" data-skill="Listening"><div class="grid">
        <div class="field"><label for="lis_part">Section / phần đã làm</label><input id="lis_part" data-label="Section / phần" placeholder="Ví dụ: Section 2"></div>
        <div class="field"><label for="lis_score">Kết quả</label><input id="lis_score" data-label="Kết quả" placeholder="Ví dụ: 8/10 hoặc 32/40"></div>
        <div class="field wide"><label for="lis_types">Dạng câu hỏi đã luyện</label><input id="lis_types" data-label="Dạng câu hỏi" placeholder="Ví dụ: map labelling, multiple choice"></div>
        <div class="field wide"><label for="lis_mistakes">Lỗi / câu cần xem lại</label><textarea id="lis_mistakes" data-label="Lỗi cần sửa"></textarea></div>
        <div class="field wide"><label for="lis_vocab">Từ/cụm từ mới</label><textarea id="lis_vocab" data-label="Từ/cụm từ mới"></textarea></div>
        <div class="field wide"><label for="lis_next">Buổi sau sẽ làm</label><textarea id="lis_next" data-label="Buổi sau"></textarea></div>
      </div></div>
      <div class="skill-panel" data-skill="Reading"><div class="grid">
        <div class="field"><label for="rea_passage">Passage / phần đã làm</label><input id="rea_passage" data-label="Passage / phần" placeholder="Ví dụ: Passage 2"></div>
        <div class="field"><label for="rea_score">Kết quả</label><input id="rea_score" data-label="Kết quả" placeholder="Ví dụ: 11/13 hoặc 32/40"></div>
        <div class="field wide"><label for="rea_types">Dạng câu hỏi đã luyện</label><input id="rea_types" data-label="Dạng câu hỏi" placeholder="Ví dụ: True/False/Not Given, Matching Headings"></div>
        <div class="field wide"><label for="rea_mistakes">Lỗi / câu cần xem lại</label><textarea id="rea_mistakes" data-label="Lỗi cần sửa"></textarea></div>
        <div class="field wide"><label for="rea_vocab">Từ/cụm từ mới</label><textarea id="rea_vocab" data-label="Từ/cụm từ mới"></textarea></div>
        <div class="field wide"><label for="rea_next">Buổi sau sẽ làm</label><textarea id="rea_next" data-label="Buổi sau"></textarea></div>
      </div></div>
      <div class="skill-panel" data-skill="Writing"><div class="grid">
        <div class="field"><label for="wri_task">Dạng bài</label><select id="wri_task" data-label="Dạng bài"><option>Task 1 Academic</option><option>Task 1 General Training</option><option>Task 2</option></select></div>
        <div class="field"><label for="wri_words">Số từ</label><input id="wri_words" data-label="Số từ" type="number" min="0" placeholder="Ví dụ: 275"></div>
        <div class="field"><label for="wri_band">Band tự đánh giá (nếu có)</label><input id="wri_band" data-label="Band tự đánh giá" placeholder="Ví dụ: 6.0"></div>
        <div class="field"><label for="wri_feedback">Nguồn nhận xét</label><input id="wri_feedback" data-label="Nguồn nhận xét" placeholder="Ví dụ: tự sửa / giáo viên"></div>
        <div class="field wide"><label for="wri_topic">Đề bài / chủ đề</label><textarea id="wri_topic" data-label="Đề bài / chủ đề"></textarea></div>
        <div class="field wide"><label for="wri_strength">Điểm làm tốt</label><textarea id="wri_strength" data-label="Điểm làm tốt"></textarea></div>
        <div class="field wide"><label for="wri_improve">Điểm cần cải thiện</label><textarea id="wri_improve" data-label="Điểm cần cải thiện"></textarea></div>
        <div class="field wide"><label for="wri_next">Buổi sau sẽ làm</label><textarea id="wri_next" data-label="Buổi sau"></textarea></div>
      </div></div>
      <div class="skill-panel" data-skill="Speaking"><div class="grid">
        <div class="field"><label for="spe_part">Part</label><select id="spe_part" data-label="Part"><option>Part 1</option><option>Part 2</option><option>Part 3</option><option>Full test</option></select></div>
        <div class="field"><label for="spe_topic">Chủ đề</label><input id="spe_topic" data-label="Chủ đề" placeholder="Ví dụ: Describe a memorable trip"></div>
        <div class="field wide"><label for="spe_recording">Link ghi âm (nếu có)</label><input id="spe_recording" data-label="Link ghi âm" type="url" placeholder="Link riêng tư tới file ghi âm"></div>
        <div class="field wide"><label for="spe_fluency">Fluency & coherence: điều cần nhớ</label><textarea id="spe_fluency" data-label="Fluency & coherence"></textarea></div>
        <div class="field wide"><label for="spe_vocab">Lexical resource: từ/cụm từ mới</label><textarea id="spe_vocab" data-label="Lexical resource / từ mới"></textarea></div>
        <div class="field wide"><label for="spe_grammar">Grammar & pronunciation: điểm cần sửa</label><textarea id="spe_grammar" data-label="Grammar & pronunciation"></textarea></div>
        <div class="field wide"><label for="spe_next">Buổi sau sẽ luyện</label><textarea id="spe_next" data-label="Buổi sau"></textarea></div>
      </div></div>
      <div class="actions"><button id="submit" type="submit">Submit, commit và push</button><span class="hint">Mỗi kỹ năng ghi vào một file riêng.</span></div>
    </section>
  </form>
</main>
<script>
  const $ = id => document.getElementById(id);
  $('studyDate').value = new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
  function status(message, kind) { const el=$('status'); el.textContent=message; el.className=`status show ${kind}`; }
  function updateTemplate() { const skill=$('skill').value; document.querySelectorAll('.skill-panel').forEach(p=>p.classList.toggle('active',p.dataset.skill===skill)); $('templateTitle').textContent=`Mẫu ${skill}`; }
  $('skill').addEventListener('change',updateTemplate);
  async function request(path, body) { const res=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined}); const data=await res.json(); if(!res.ok) throw new Error(data.error||'Yêu cầu thất bại'); return data; }
  $('saveConfig').addEventListener('click',async()=>{try{await request('/api/config',{repoPath:$('repoPath').value.trim()});status('Đã lưu và kiểm tra repository.','ok');}catch(e){status(e.message,'err');}});
  fetch('/api/config').then(r=>r.json()).then(c=>{if(c.repoPath)$('repoPath').value=c.repoPath;}).catch(()=>{});
  $('logForm').addEventListener('submit',async e=>{
    e.preventDefault();const button=$('submit');button.disabled=true;status('Đang ghi log, commit và push…','info');
    const skill=$('skill').value,panel=document.querySelector(`.skill-panel[data-skill="${skill}"]`);
    const details=[...panel.querySelectorAll('[data-label]')].map(el=>({label:el.dataset.label,value:el.value.trim()})).filter(x=>x.value);
    try{const result=await request('/api/save',{skill,studyDate:$('studyDate').value,source:$('source').value.trim(),lesson:$('lesson').value.trim(),minutes:$('minutes').value,details});status(`${result.message}\nFile: ${result.file}`,result.pushed?'ok':'err');if(result.saved){panel.querySelectorAll('textarea').forEach(x=>x.value='');}}
    catch(err){status(`Chưa ghi được: ${err.message}`,'err');}finally{button.disabled=false;}
  });
</script></body></html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>IELTS Study Log</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=4">
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#263746;background:#f5f7f9;font-synthesis:none;--navy:#153b59;--blue:#17628a;--orange:#e96c36;--orange-soft:#fff3ed;--line:#dfe5ea;--muted:#71808c}
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{overflow:hidden;padding:14px;background:#f5f7f9}
    main{height:100%;max-width:1500px;margin:auto;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto;gap:10px}
    .top{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:42px}.top-brand{display:flex;align-items:center;gap:12px}.brand-mark{width:40px;height:40px;border:0;border-radius:0;display:grid;place-items:center;background:transparent;color:var(--navy);font-weight:800;font-size:11px;letter-spacing:.02em}
    h1{font-size:22px;line-height:1.1;margin:0;color:var(--navy);font-weight:700}.status{display:none;max-width:55%;padding:8px 11px;border-radius:7px;font-size:12px;line-height:1.35;white-space:pre-wrap}.status.show{display:block}.ok{background:#edf7f2;color:#236746}.err{background:#fff0ed;color:#b93820}.info{background:#eef5f8;color:#285c78}
    .card{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;box-shadow:0 1px 2px #172b3a08}.repo-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:end;gap:8px 10px}
    .top-meta{display:flex;align-items:center;gap:10px}.today-stamp{font-size:12px;font-weight:650;color:#526372;background:#f3f6f8;border:1px solid var(--line);border-radius:6px;padding:7px 10px}.session-fields{display:grid;grid-template-columns:minmax(150px,.9fr) minmax(220px,1.6fr) 130px;align-items:end;gap:8px 10px;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid #e8edf0}
    label{display:block;font-size:11px;font-weight:650;margin:0 0 5px;color:#526372}input,select,textarea{width:100%;height:34px;border:1px solid #d4dde4;border-radius:6px;padding:8px 10px;font:inherit;font-size:12px;background:#fff;color:#263746;transition:border-color .15s,box-shadow .15s}
    input:focus,select:focus,textarea:focus{outline:none;border-color:#7da8bd;box-shadow:0 0 0 2px #17628a18}input[readonly]{background:#f8fafb;color:#61717e}textarea{height:56px;min-height:56px;resize:none;line-height:1.35}
    .workspace{display:grid;grid-template-columns:300px minmax(0,1fr);gap:10px;min-height:0;align-items:stretch}.sidebar{display:flex;flex-direction:column;gap:9px;padding:16px;background:#fff;min-height:100%;height:100%}
    .sidebar-brand{display:flex;align-items:center;gap:10px;padding:2px 7px 15px;border-bottom:1px solid #e8edf0;margin-bottom:3px}.sidebar-brand .brand-mini{width:34px;height:34px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:750;font-size:10px}.sidebar-brand strong{font-size:14px;color:var(--navy)}
    .side-title{font-size:10px;font-weight:750;letter-spacing:.08em;color:#7a8994;padding:5px 8px;text-transform:uppercase}
    .skill-button{min-height:64px;border:1px solid transparent;background:transparent;color:#304656;border-radius:7px;padding:10px 12px;text-align:left;font-weight:650;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s,border-color .15s}
    .skill-button:hover{background:#f5f8fa}.skill-button.active{background:#f2f7fa;border-color:#ccdae2;color:var(--navy);box-shadow:inset 3px 0 0 var(--orange)}
    .skill-icon{width:35px;height:35px;flex:0 0 35px;display:grid;place-items:center;border-radius:7px;background:#f5f8fa;color:var(--blue)}.skill-button.active .skill-icon{background:var(--orange-soft);color:var(--orange)}.skill-icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .panel{display:none;min-height:0;overflow:visible;border-top:2px solid var(--navy)}.panel.active{display:block}.panel-head{display:flex;align-items:center;gap:10px;margin:0 0 12px;padding:0 0 9px;border-bottom:1px solid #e8edf0}.panel-icon{width:32px;height:32px;border:1px solid #f0c4ae;border-radius:7px;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;font-weight:750;font-size:11px}.panel-head h2{font-size:15px;margin:0;color:var(--navy);font-weight:700}
    .skill-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:minmax(61px,auto);gap:10px 12px}.field{min-width:0}.wide{grid-column:span 2}.full{grid-column:1/-1}
    button.action{border:0;border-radius:6px;height:34px;padding:0 16px;background:var(--navy);color:#fff;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;transition:background .15s}button.action:hover:not(:disabled){background:#0d304a}button.action:disabled{opacity:.6;cursor:wait}.secondary{background:#fff!important;color:var(--navy)!important;border:1px solid #b9c8d2!important}.secondary:hover:not(:disabled){background:#f5f8fa!important}.footer{display:flex;align-items:center;justify-content:flex-end;gap:12px}
    .page-button{min-height:46px;border:1px solid transparent;background:transparent;color:#304656;border-radius:7px;padding:8px 12px;text-align:left;font-weight:650;font-size:13px;cursor:pointer}.page-button:hover{background:#f5f8fa}.page-button.active{background:#f2f7fa;border-color:#ccdae2;color:var(--navy);box-shadow:inset 3px 0 0 var(--orange)}
    .content-area{min-width:0;min-height:0;overflow:hidden}.view{display:none;height:100%;min-height:0;overflow:auto;border-top:2px solid var(--navy)}.view.active{display:block}#overviewPage{overflow:hidden}#historyPage{overflow:auto}#sessionPage{overflow-y:auto;overflow-x:hidden}.page-heading{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px;padding:0 0 7px;border-bottom:1px solid #e8edf0}.page-heading h2{margin:0;font-size:17px;color:var(--navy)}.period-field{width:180px}.period-field label{margin-bottom:4px}
    .activity-visuals{display:grid;grid-template-columns:minmax(280px,.8fr) minmax(0,1.8fr);gap:8px;margin-bottom:8px}.visual-card{min-width:0;padding:10px}.visual-heading{margin-bottom:8px}.visual-heading h3{margin:0;color:var(--navy);font-size:14px}.visual-heading p{margin:4px 0 0;color:var(--muted);font-size:11px}.radar-card svg{display:block;width:100%;height:190px;max-height:190px}.activity-calendar-heading{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.calendar-legend{display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--muted);font-size:10px}.calendar-legend span:first-child{margin-right:3px}.calendar-legend span:last-child{margin-left:3px}.calendar-legend i,.contribution-cell{width:11px;height:11px;border:1px solid #e2e7e9;border-radius:2px;background:#f0f2f3}.calendar-legend .level-1,.contribution-cell.level-1{background:#c6eacb;border-color:#c6eacb}.calendar-legend .level-2,.contribution-cell.level-2{background:#85d99a;border-color:#85d99a}.calendar-legend .level-3,.contribution-cell.level-3{background:#3dbb67;border-color:#3dbb67}.calendar-legend .level-4,.contribution-cell.level-4{background:#137a3e;border-color:#137a3e}.calendar-scroll{overflow-x:auto;padding:4px 0 8px}.calendar-months{height:20px;position:relative;margin-left:30px;width:742px;min-width:742px}.calendar-months span{position:absolute;top:0;font-size:10px;color:var(--muted);white-space:nowrap}.calendar-layout{display:flex;gap:5px;min-width:max-content}.calendar-weekdays{display:grid;grid-template-rows:repeat(7,11px);gap:3px;width:25px;flex:0 0 25px;color:var(--muted);font-size:9px;line-height:11px}.contribution-grid{display:grid;grid-template-rows:repeat(7,11px);grid-auto-columns:11px;grid-auto-flow:column;gap:3px}.contribution-cell{display:block;padding:0;cursor:default}.contribution-cell.level-0{background:#f0f2f3;border-color:#e2e7e9}
    .summary-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:8px}.summary-card,.skill-overview{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff}.summary-card span,.metric span{display:block;color:var(--muted);font-size:11px}.summary-card strong{display:block;color:var(--navy);font-size:22px;margin-top:4px}.overview-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.skill-overview h3{margin:0 0 12px;color:var(--navy);font-size:14px}.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric strong{display:block;margin-top:4px;font-size:17px;color:#263746}.metric.last{grid-column:auto}.empty-message{color:var(--muted);font-size:13px;text-align:center;padding:20px}
    .history-filters{display:grid;grid-template-columns:1fr 1fr 1fr 1.5fr 1fr;gap:8px;margin-bottom:12px}.history-list{display:grid;gap:8px}.history-pagination{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px 0 4px}.history-pagination button{height:32px;padding:0 12px;border:1px solid #b9c8d2;border-radius:6px;background:#fff;color:var(--navy);font:inherit;font-size:12px;font-weight:650;cursor:pointer}.history-pagination button:disabled{opacity:.45;cursor:default}.history-pagination span{font-size:12px;color:var(--muted)}.history-pagination[hidden]{display:none}.history-entry{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:13px 15px;background:#fff}.history-entry[data-skill="Listening"]{border-left-color:#22824a}.history-entry[data-skill="Reading"]{border-left-color:#2676a8}.history-entry[data-skill="Writing"]{border-left-color:#dc7139}.history-entry[data-skill="Speaking"]{border-left-color:#8057a6}.history-entry-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:5px}.history-entry-head strong{color:var(--navy);font-size:14px}.history-entry time,.history-meta{font-size:12px;color:var(--muted)}.history-entry h3{font-size:15px;line-height:1.4;margin:5px 0;color:#263746;overflow-wrap:anywhere}.history-details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:11px 0 0;padding-top:10px;border-top:1px solid #e8edf0}.history-details span{display:block;min-width:0;padding:9px 11px;border:1px solid #e1e9ed;border-radius:7px;background:#f7fafb;font-size:13px;line-height:1.5;color:#344957;overflow-wrap:anywhere}.history-details b{display:block;margin-bottom:3px;color:#526572;font-size:11px;letter-spacing:.025em}.history-details .detail-score{background:#edf7f0;border-color:#cce6d4}.history-details .detail-score b{color:#267344}.history-details .detail-mistakes{grid-column:1/-1;background:#fff7ec;border-color:#f1dfbe}.history-details .detail-mistakes b{color:#9a5b16}.history-details .detail-feedback{grid-column:1/-1;background:#fff5ef;border-color:#f2d9c9}.history-details .detail-passage{background:#eff6fb;border-color:#d4e4ef}.detail-value{white-space:pre-wrap;overflow-wrap:anywhere}
    #wri_topic{height:96px;min-height:96px;resize:vertical}#wri_feedback{height:190px;min-height:140px;resize:vertical;line-height:1.5}.field:has(#wri_feedback){grid-column:2/-1}.field:has(#wri_topic){grid-column:1}
    .footer.hidden{display:none}
    @media(max-height:680px){body{padding:7px}main{gap:6px}.card{padding:7px 9px}.top-brand .brand-mark{width:35px;height:35px}.session-fields{gap:6px 8px;margin-bottom:8px;padding-bottom:8px}.radar-card svg{height:145px;max-height:145px}.skill-overview{padding:7px}.skill-overview h3{margin-bottom:7px}.skill-grid{grid-auto-rows:minmax(50px,auto);gap:5px 8px}textarea{height:45px;min-height:45px}#wri_feedback{height:150px;min-height:130px}.skill-button{min-height:45px}.sidebar{gap:4px}.panel-head{margin-bottom:7px}}
    @media(max-width:900px){html,body{height:auto;min-height:100%}body{overflow:auto}main{height:auto;min-height:100vh;grid-template-rows:auto auto minmax(400px,1fr) auto}.session-fields{grid-template-columns:repeat(2,minmax(0,1fr))}.workspace{grid-template-columns:235px minmax(0,1fr)}.activity-visuals{grid-template-columns:1fr}.skill-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.wide{grid-column:span 1}.full{grid-column:1/-1}#sessionPage{height:auto;overflow:visible}.field:has(#wri_feedback){grid-column:1/-1}.history-details{grid-template-columns:1fr}.history-details .detail-mistakes,.history-details .detail-feedback{grid-column:1}}
    @media(max-width:560px){.top{align-items:flex-start;flex-direction:column}.status{max-width:100%}.repo-row{grid-template-columns:1fr}.session-fields,.skill-grid,.summary-grid,.overview-grid,.history-filters{grid-template-columns:1fr}.workspace{grid-template-columns:1fr}.sidebar{display:grid;grid-template-columns:repeat(2,1fr)}.sidebar-brand,.side-title{grid-column:1/-1}.overview-grid{grid-template-columns:1fr}.activity-visuals{grid-template-columns:1fr}.history-filters{grid-template-columns:repeat(2,minmax(0,1fr))}.history-details{grid-template-columns:1fr}.history-details .detail-mistakes,.history-details .detail-feedback{grid-column:1}.wide,.full{grid-column:1}.footer{justify-content:stretch}.footer button{width:100%}.skill-grid{grid-auto-rows:auto}}
  </style>
</head>
<body><main>
  <header class="top"><div class="top-brand"><span class="brand-mark">IELTS</span><h1>IELTS Study Log</h1></div><div class="top-meta"><span class="today-stamp" id="todayStamp"></span><div id="status" class="status" role="status" aria-live="polite"></div></div></header>

  <section class="card repo-row">
    <div><label for="repoSelect">Repository</label><select id="repoSelect"><option value="">Searching repositories…</option></select></div>
    <button id="refreshRepos" class="action secondary" type="button">Refresh</button>
    <button id="linkRepo" class="action" type="button">Link repository</button>
  </section>


  <div class="workspace">
    <nav class="card sidebar" aria-label="IELTS skills">
      <div class="sidebar-brand"><span class="brand-mini">IELTS</span><strong>Study Log</strong></div>
      <button class="page-button active" type="button" data-page="overview">Activity Overview</button>

      <div class="side-title">SKILLS</div>
      <button class="skill-button active" type="button" data-skill="Listening"><span class="skill-icon"><svg viewBox="0 0 24 24"><path d="M4 13v-1a8 8 0 0 1 16 0v1"/><rect x="3" y="12" width="4" height="7" rx="2"/><rect x="17" y="12" width="4" height="7" rx="2"/><path d="M19 19a4 4 0 0 1-4 3h-2"/></svg></span><span>Listening</span></button>
      <button class="skill-button" type="button" data-skill="Reading"><span class="skill-icon"><svg viewBox="0 0 24 24"><path d="M12 6c-2.5-2-5.5-2-9-1v14c3.5-1 6.5-1 9 1 2.5-2 5.5-2 9-1V5c-3.5-1-6.5-1-9 1z"/><path d="M12 6v14"/></svg></span><span>Reading</span></button>
      <button class="skill-button" type="button" data-skill="Writing"><span class="skill-icon"><svg viewBox="0 0 24 24"><path d="m4 16.5-.8 4.3 4.3-.8L20 7.5 16.5 4 4 16.5z"/><path d="m14.5 6 3.5 3.5"/></svg></span><span>Writing</span></button>
      <button class="skill-button" type="button" data-skill="Speaking"><span class="skill-icon"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg></span><span>Speaking</span></button>
      <button class="page-button" type="button" data-page="history">History</button>
    </nav>

    <div class="content-area">
      <section id="overviewPage" class="card view active">
        <div class="page-heading"><h2>Activity Overview</h2><div class="field period-field"><label for="overviewRange">Period</label><select id="overviewRange"><option value="7">Last 7 days</option><option value="30">Last 30 days</option><option value="all">All time</option></select></div></div>
        <div id="summaryCards" class="summary-grid"></div>
        <div class="activity-visuals">
          <section class="card visual-card radar-card"><div class="visual-heading"><h3>Study time by skill</h3><p>Share of recorded study minutes in the selected period</p></div><svg id="skillRadar" viewBox="0 0 360 290" role="img" aria-label="Study time share by IELTS skill"></svg></section>
          <section class="card visual-card calendar-card"><div class="visual-heading activity-calendar-heading"><div><h3>Study activity</h3><p id="calendarSummary">Daily sessions in the last year</p></div><div class="calendar-legend"><span>Less</span><i class="level-0"></i><i class="level-1"></i><i class="level-2"></i><i class="level-3"></i><i class="level-4"></i><span>More</span></div></div><div class="calendar-scroll"><div id="calendarMonths" class="calendar-months"></div><div class="calendar-layout"><div class="calendar-weekdays"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div><div id="calendarGrid" class="contribution-grid"></div></div></div></section>
        </div>
        <div id="skillOverview" class="overview-grid"></div>
        <p id="overviewMessage" class="empty-message"></p>
      </section>
      <section id="historyPage" class="card view">
        <div class="page-heading"><h2>Study History</h2></div>
        <div class="history-filters"><div class="field"><label for="historySkill">Skill</label><select id="historySkill"><option value="all">All skills</option><option>Listening</option><option>Reading</option><option>Writing</option><option>Speaking</option></select></div><div class="field"><label for="historyFrom">From</label><input id="historyFrom" type="date"></div><div class="field"><label for="historyTo">To</label><input id="historyTo" type="date"></div><div class="field"><label for="historySearch">Search</label><input id="historySearch" type="search" placeholder="Lesson, source, or notes"></div><div class="field"><label for="historySort">Date order</label><select id="historySort"><option value="newest">Newest first</option><option value="oldest">Oldest first</option></select></div></div>
        <div id="historyList" class="history-list"></div>
        <div id="historyPagination" class="history-pagination" hidden></div>
      </section>
      <div id="sessionPage" class="view">
    <form id="logForm" class="card panel active" data-skill="Listening"><div class="panel-head"><span class="panel-icon">01</span><h2>Listening</h2></div>
    <div class="session-fields"><div class="field"><label for="lis_source">Source</label><input id="lis_source" data-session="source" value="Study4" required></div><div class="field"><label for="lis_lesson">Lesson / topic</label><input id="lis_lesson" data-session="lesson" placeholder="Lesson title" required></div><div class="field"><label for="lis_minutes">Duration (minutes)</label><input id="lis_minutes" data-session="minutes" type="number" min="1" max="1440" value="30" required></div></div>
    <div class="skill-grid">
      <div class="field"><label for="lis_part">Section</label><select id="lis_part" data-label="Section"><option value="" selected>Select a section</option><option>Section 1</option><option>Section 2</option><option>Section 3</option><option>Section 4</option><option>Full test</option></select></div>
      <div class="field"><label for="lis_score">Score</label><input id="lis_score" data-label="Score" placeholder="8/10"></div>
      <div class="field"><label for="lis_types">Question types</label><input id="lis_types" data-label="Question types"></div>
      <div class="field full"><label for="lis_mistakes">Mistakes / review notes</label><textarea id="lis_mistakes" data-label="Mistakes to review"></textarea></div>
    </div></form>

    <form id="readingForm" class="card panel" data-skill="Reading"><div class="panel-head"><span class="panel-icon">02</span><h2>Reading</h2></div>
    <div class="session-fields"><div class="field"><label for="rea_source">Source</label><input id="rea_source" data-session="source" value="Study4" required></div><div class="field"><label for="rea_lesson">Lesson / topic</label><input id="rea_lesson" data-session="lesson" placeholder="Lesson title" required></div><div class="field"><label for="rea_minutes">Duration (minutes)</label><input id="rea_minutes" data-session="minutes" type="number" min="1" max="1440" value="30" required></div></div>
    <div class="skill-grid">
      <div class="field"><label for="rea_passage">Passage</label><select id="rea_passage" data-label="Passage"><option value="" selected>Select a passage</option><option>Passage 1</option><option>Passage 2</option><option>Passage 3</option><option>Full test</option></select></div>
      <div class="field"><label for="rea_score">Score</label><input id="rea_score" data-label="Score" placeholder="11/13"></div>
      <div class="field"><label for="rea_types">Question types</label><input id="rea_types" data-label="Question types"></div>
      <div class="field full"><label for="rea_mistakes">Mistakes / review notes</label><textarea id="rea_mistakes" data-label="Mistakes to review"></textarea></div>
    </div></form>

    <form id="writingForm" class="card panel" data-skill="Writing"><div class="panel-head"><span class="panel-icon">03</span><h2>Writing</h2></div>
    <div class="session-fields"><div class="field"><label for="wri_source">Source</label><input id="wri_source" data-session="source" value="Study4" required></div><div class="field"><label for="wri_lesson">Lesson / topic</label><input id="wri_lesson" data-session="lesson" placeholder="Lesson title" required></div><div class="field"><label for="wri_minutes">Duration (minutes)</label><input id="wri_minutes" data-session="minutes" type="number" min="1" max="1440" value="30" required></div></div>
    <div class="skill-grid">
      <div class="field"><label for="wri_task">Task type</label><select id="wri_task" data-label="Task type"><option>Task 1 Academic</option><option>Task 1 General Training</option><option>Task 2</option></select></div>
      <div class="field"><label for="wri_words">Word count</label><input id="wri_words" data-label="Word count" type="number" min="0"></div>
      <div class="field"><label for="wri_band">Self-assessed band</label><input id="wri_band" data-label="Self-assessed band"></div>
      <div class="field"><label for="wri_topic">Prompt / topic</label><textarea id="wri_topic" data-label="Prompt / topic"></textarea></div>
      <div class="field wide"><label for="wri_feedback">Feedback / areas to improve</label><textarea id="wri_feedback" data-label="Feedback / areas to improve"></textarea></div>
    </div></form>

    <form id="speakingForm" class="card panel" data-skill="Speaking"><div class="panel-head"><span class="panel-icon">04</span><h2>Speaking</h2></div>
    <div class="session-fields"><div class="field"><label for="spe_source">Source</label><input id="spe_source" data-session="source" value="Study4" required></div><div class="field"><label for="spe_lesson">Lesson / topic</label><input id="spe_lesson" data-session="lesson" placeholder="Lesson title" required></div><div class="field"><label for="spe_minutes">Duration (minutes)</label><input id="spe_minutes" data-session="minutes" type="number" min="1" max="1440" value="30" required></div></div>
    <div class="skill-grid">
      <div class="field"><label for="spe_part">Part</label><select id="spe_part" data-label="Part"><option>Part 1</option><option>Part 2</option><option>Part 3</option><option>Full test</option></select></div>
      <div class="field"><label for="spe_topic">Topic</label><input id="spe_topic" data-label="Topic"></div>
      <div class="field"><label for="spe_recording">Recording link</label><input id="spe_recording" data-label="Recording link" type="url"></div>
      <div class="field full"><label for="spe_review">Self-assessment</label><textarea id="spe_review" data-label="Self-assessment"></textarea></div>
    </div></form>
      </div>
    </div>
  </div>

  <footer class="footer"><button id="submit" class="action" type="submit" form="logForm">Submit log</button></footer>
</main>
<script>
  const $=id=>document.getElementById(id);
  const localDate=()=>{const now=new Date();return [now.getFullYear(),String(now.getMonth()+1).padStart(2,'0'),String(now.getDate()).padStart(2,'0')].join('-');};
  const updateToday=()=>{$('todayStamp').textContent='Study date · '+new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'2-digit',year:'numeric'}).format(new Date());};
  updateToday();setInterval(updateToday,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateToday();});
  let currentSkill='Listening';
  let historyEntries=[];
  const skills=['Listening','Reading','Writing','Speaking'];
  const forms=Object.fromEntries([...document.querySelectorAll('.panel')].map(form=>[form.dataset.skill,form]));
  function setStatus(message,kind){const el=$('status');el.textContent=message;el.className=message?`status show ${kind}`:'status';}
  function showPage(page){const target={overview:'overviewPage',history:'historyPage',session:'sessionPage'}[page];document.querySelectorAll('.content-area>.view').forEach(view=>view.classList.toggle('active',view.id===target));document.querySelectorAll('.page-button').forEach(button=>button.classList.toggle('active',button.dataset.page===page));document.querySelectorAll('.skill-button').forEach(button=>button.classList.toggle('active',page==='session'&&button.dataset.skill===currentSkill));document.querySelector('.footer').classList.toggle('hidden',page!=='session');if(page==='overview')renderOverview();if(page==='history'){renderHistory();loadHistory();}}  function selectSkill(skill){currentSkill=skill;document.querySelectorAll('.skill-button').forEach(button=>button.classList.toggle('active',button.dataset.skill===skill));document.querySelectorAll('.panel').forEach(panel=>panel.classList.toggle('active',panel.dataset.skill===skill));$('submit').setAttribute('form',forms[skill].id);showPage('session');}
  document.querySelectorAll('.skill-button').forEach(button=>button.addEventListener('click',()=>selectSkill(button.dataset.skill)));
  document.querySelectorAll('.page-button').forEach(button=>button.addEventListener('click',()=>showPage(button.dataset.page)));  async function request(path,body){const res=await fetch(path,{method:body?'POST':'GET',headers:body?{'Content-Type':'application/json'}:{},body:body?JSON.stringify(body):undefined});const data=await res.json().catch(()=>({}));if(!res.ok){if(res.status===404&&(path==='/api/repos'||path==='/api/config'||path==='/api/history'))throw new Error('The app server is outdated. Close its Command Prompt window with Ctrl+C, then run ieltslog again.');throw new Error(data.error||'Request failed');}return data;}
  fetch('/api/version').then(async response=>{if(!response.ok)throw new Error('old');const info=await response.json();if(info.version<4)throw new Error('old');}).catch(()=>setStatus('The app server is outdated. Close its Command Prompt window with Ctrl+C, then run ieltslog again.','err'));
  function fillRepos(repos,currentPath){const select=$('repoSelect');select.replaceChildren();if(!repos.length){const empty=document.createElement('option');empty.value='';empty.textContent='No repositories found';select.appendChild(empty);return;}for(const repo of repos){const option=document.createElement('option');option.value=repo.path;option.textContent=repo.name+' — '+repo.path;if(currentPath&&repo.path.toLowerCase()===currentPath.toLowerCase())option.selected=true;select.appendChild(option);}if(currentPath&&!repos.some(repo=>repo.path.toLowerCase()===currentPath.toLowerCase())){const current=document.createElement('option');current.value=currentPath;current.textContent=currentPath.split(/[\\/]/).pop()+' — '+currentPath;current.selected=true;select.appendChild(current);}}
  async function loadRepos(showMessage){if(showMessage)setStatus('Scanning repositories…','info');try{const [config,list]=await Promise.all([request('/api/config'),request('/api/repos')]);fillRepos(list.repositories||[],config.repoPath);if(showMessage)setStatus('Repository list refreshed.','ok');}catch(error){setStatus(error.message,'err');}}
  $('refreshRepos').addEventListener('click',async()=>{const button=$('refreshRepos');button.disabled=true;await loadRepos(true);button.disabled=false;});
  $('linkRepo').addEventListener('click',async()=>{const button=$('linkRepo');button.disabled=true;const repoPath=$('repoSelect').value;if(!repoPath){setStatus('Select a repository to link.','err');button.disabled=false;return;}try{await request('/api/config',{repoPath});setStatus('Repository linked.','ok');loadHistory();}catch(error){setStatus(error.message,'err');}finally{button.disabled=false;}});
  function formatDate(value){return value?new Intl.DateTimeFormat('en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(value+'T00:00:00')):'—';}
  function formatDuration(minutes){const hours=Math.floor(minutes/60),remaining=minutes%60;if(hours&&remaining)return hours+'h '+remaining+'m';if(hours)return hours+'h';return minutes+'m';}
  function createNode(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node;}
  function periodEntries(){const range=$('overviewRange').value;if(range==='all')return historyEntries;const start=new Date();start.setDate(start.getDate()-Number(range)+1);const from=localDateValue(start);return historyEntries.filter(entry=>entry.date>=from&&entry.date<=localDate());}
  function localDateValue(date){return [date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');}
  function renderOverview(){const entries=periodEntries(),minutes=entries.reduce((sum,entry)=>sum+Number(entry.minutes||0),0),days=new Set(entries.map(entry=>entry.date)).size;const stats=[['Sessions',entries.length],['Study time',formatDuration(minutes)],['Active study days',days]];const summary=$('summaryCards');summary.replaceChildren();for(const [label,value] of stats){const card=createNode('div','summary-card');card.append(createNode('span','',label),createNode('strong','',String(value)));summary.appendChild(card);}const grid=$('skillOverview');grid.replaceChildren();for(const skill of skills){const sessions=entries.filter(entry=>entry.skill===skill),skillMinutes=sessions.reduce((sum,entry)=>sum+Number(entry.minutes||0),0),skillDays=new Set(sessions.map(entry=>entry.date)).size,recent=sessions[0];const card=createNode('section','skill-overview');card.appendChild(createNode('h3','',skill));const metrics=createNode('div','metric-grid');const values=[['Sessions',String(sessions.length)],['Study time',formatDuration(skillMinutes)],['Study days',String(skillDays)],['Last practiced',recent?formatDate(recent.date):'—']];for(const [label,value] of values){const metric=createNode('div','metric'+(label==='Last practiced'?' last':''));metric.append(createNode('span','',label),createNode('strong','',value));metrics.appendChild(metric);}card.appendChild(metrics);grid.appendChild(card);} $('overviewMessage').textContent=entries.length?'':'No study sessions found for this period.';renderRadar(entries);renderCalendar();}
  function renderRadar(entries){const svg=$('skillRadar'),ns='http://www.w3.org/2000/svg',center={x:180,y:145},radius=76,total=entries.reduce((sum,entry)=>sum+Number(entry.minutes||0),0),minutes=skills.map(skill=>entries.filter(entry=>entry.skill===skill).reduce((sum,entry)=>sum+Number(entry.minutes||0),0)),shares=minutes.map(value=>total?Math.round(value/total*100):0),angles=[-90,0,90,180];svg.replaceChildren();const node=(tag,attrs={})=>{const el=document.createElementNS(ns,tag);for(const [key,value] of Object.entries(attrs))el.setAttribute(key,String(value));return el;};for(const level of [25,50,75,100]){const points=angles.map(angle=>{const rad=angle*Math.PI/180;return (center.x+Math.cos(rad)*radius*level/100)+','+(center.y+Math.sin(rad)*radius*level/100)}).join(' ');svg.appendChild(node('polygon',{points,fill:'none',stroke:'#dfe7e2','stroke-width':1}));}angles.forEach(angle=>{const rad=angle*Math.PI/180;svg.appendChild(node('line',{x1:center.x,y1:center.y,x2:center.x+Math.cos(rad)*radius,y2:center.y+Math.sin(rad)*radius,stroke:'#176b38','stroke-width':1.5}));});const points=angles.map((angle,index)=>{const rad=angle*Math.PI/180,r=radius*shares[index]/100;return (center.x+Math.cos(rad)*r)+','+(center.y+Math.sin(rad)*r)}).join(' ');svg.appendChild(node('polygon',{points,fill:'#8de0a5','fill-opacity':'.55',stroke:'#21894a','stroke-width':2}));angles.forEach((angle,index)=>{const rad=angle*Math.PI/180,r=radius*shares[index]/100,x=center.x+Math.cos(rad)*r,y=center.y+Math.sin(rad)*r;svg.appendChild(node('circle',{cx:x,cy:y,r:3.5,fill:'#fff',stroke:'#176b38','stroke-width':2}));});const labels=[{x:180,y:28,anchor:'middle'},{x:278,y:148,anchor:'start'},{x:180,y:276,anchor:'middle'},{x:82,y:148,anchor:'end'}];labels.forEach((label,index)=>{const text=node('text',{x:label.x,y:label.y,'text-anchor':label.anchor,fill:'#455a64','font-size':12});text.textContent=skills[index]+' '+shares[index]+'%';svg.appendChild(text);});svg.setAttribute('aria-label',skills.map((skill,index)=>skill+' '+shares[index]+' percent of study time').join(', '));}
  async function openHistoryForDate(date){$('historySkill').value='all';$('historyFrom').value=date;$('historyTo').value=date;await showPage('history');const target=document.querySelector('#historyList .history-entry')||$('historyList');target.scrollIntoView({behavior:'smooth',block:'center'});}  function renderCalendar(){const grid=$('calendarGrid'),months=$('calendarMonths'),today=new Date(),end=new Date(today.getFullYear(),today.getMonth(),today.getDate()),cutoff=new Date(end);cutoff.setDate(cutoff.getDate()-364);const start=new Date(cutoff);start.setDate(start.getDate()-start.getDay());const from=localDateValue(cutoff),to=localDateValue(end),daily=new Map();let totalSessions=0;for(const entry of historyEntries){if(entry.date<from||entry.date>to)continue;const item=daily.get(entry.date)||{count:0,minutes:0};item.count++;item.minutes+=Number(entry.minutes||0);daily.set(entry.date,item);totalSessions++;}grid.replaceChildren();months.replaceChildren();const cursor=new Date(start);let week=0,lastMonth=-1;while(cursor<=end){const date=localDateValue(cursor),month=cursor.getMonth();if(month!==lastMonth){const label=createNode('span','',new Intl.DateTimeFormat('en-GB',{month:'short'}).format(cursor));label.style.left=(week*14)+'px';months.appendChild(label);lastMonth=month;}const data=daily.get(date)||{count:0,minutes:0};const cell=document.createElement('span');cell.className='contribution-cell level-'+Math.min(4,data.count);cell.title=date+': '+data.count+' session'+(data.count===1?'':'s')+' · '+formatDuration(data.minutes);cell.setAttribute('aria-label',cell.title);grid.appendChild(cell);if(cursor.getDay()===6)week++;cursor.setDate(cursor.getDate()+1);} $('calendarSummary').textContent=totalSessions+' study session'+(totalSessions===1?'':'s')+' in the last year';}
  let historyPage=1;const historyPageSize=10;
  function renderHistory(){const skill=$('historySkill').value,from=$('historyFrom').value,to=$('historyTo').value,query=$('historySearch').value.trim().toLowerCase(),sort=$('historySort').value;const filtered=historyEntries.filter(entry=>(skill==='all'||entry.skill===skill)&&(!from||entry.date>=from)&&(!to||entry.date<=to)&&(!query||[entry.skill,entry.source,entry.lesson,...(entry.details||[]).flatMap(item=>[item.label,item.value])].join(' ').toLowerCase().includes(query)));filtered.sort((a,b)=>{const left=a.date+' '+(a.time||''),right=b.date+' '+(b.time||'');return sort==='oldest'?left.localeCompare(right):right.localeCompare(left);});const list=$('historyList'),pagination=$('historyPagination');list.replaceChildren();pagination.replaceChildren();if(!filtered.length){historyPage=1;pagination.hidden=true;list.appendChild(createNode('p','empty-message','No matching study sessions.'));return;}const pageCount=Math.ceil(filtered.length/historyPageSize);historyPage=Math.min(historyPage,pageCount);const pageEntries=filtered.slice((historyPage-1)*historyPageSize,historyPage*historyPageSize);for(const entry of pageEntries){const card=createNode('article','history-entry');card.dataset.skill=entry.skill;const head=createNode('div','history-entry-head');head.append(createNode('strong','',entry.skill),createNode('time','',formatDate(entry.date)+(entry.time?' · '+entry.time:'')));card.appendChild(head);card.appendChild(createNode('h3','',entry.lesson));card.appendChild(createNode('div','history-meta',entry.source+' · '+formatDuration(Number(entry.minutes||0))));if(entry.details&&entry.details.length){const details=createNode('div','history-details');for(const item of entry.details){const labelText=String(item.label||''),normalizedLabel=labelText.toLowerCase(),kind=normalizedLabel.includes('mistake')||normalizedLabel.includes('review')?'mistakes':normalizedLabel.includes('feedback')?'feedback':normalizedLabel.includes('score')?'score':normalizedLabel.includes('passage')?'passage':'other',line=createNode('div','detail-'+kind),label=createNode('b','',labelText),value=createNode('div','detail-value');value.textContent=String(item.value||'').replace(/<br\s*\/?\s*>/gi,'\n');line.append(label,value);details.appendChild(line);}card.appendChild(details);}list.appendChild(card);}pagination.hidden=pageCount<=1;if(pageCount>1){const previous=createNode('button','','Previous'),summary=createNode('span','',`Page ${historyPage} of ${pageCount} · ${filtered.length} sessions`),next=createNode('button','','Next');previous.type='button';next.type='button';previous.disabled=historyPage===1;next.disabled=historyPage===pageCount;previous.addEventListener('click',()=>{historyPage--;renderHistory();});next.addEventListener('click',()=>{historyPage++;renderHistory();});pagination.append(previous,summary,next);}}
  function resetHistoryPage(){historyPage=1;renderHistory();}  async function loadHistory(){try{const data=await request('/api/history');historyEntries=data.entries||[];renderOverview();renderHistory();}catch(error){historyEntries=[];renderOverview();renderHistory();$('overviewMessage').textContent=error.message;$('historyList').replaceChildren(createNode('p','empty-message',error.message));}}
  $('overviewRange').addEventListener('change',renderOverview);['historySkill','historyFrom','historyTo','historySort'].forEach(id=>$(id).addEventListener('change',resetHistoryPage));$('historySearch').addEventListener('input',resetHistoryPage);  document.querySelectorAll('.panel').forEach(form=>form.addEventListener('submit',async event=>{event.preventDefault();const button=$('submit');button.disabled=true;setStatus('Saving, committing, and pushing…','info');const skillForm=forms[currentSkill];const field=name=>skillForm.querySelector('[data-session="'+name+'"]');const details=[...skillForm.querySelectorAll('[data-label]')].map(el=>({label:el.dataset.label,value:el.value.trim()})).filter(item=>item.value);try{const result=await request('/api/save',{skill:currentSkill,studyDate:localDate(),source:field('source').value.trim(),lesson:field('lesson').value.trim(),minutes:field('minutes').value,details});setStatus(result.message,'ok');if(result.saved){await loadHistory();skillForm.querySelectorAll('[data-label]').forEach(el=>{if(el.tagName==='SELECT')el.selectedIndex=0;else el.value='';});field('lesson').value='';field('minutes').value='30';}}catch(error){setStatus(error.message,'err');}finally{button.disabled=false;}}));
  loadRepos(false);loadHistory();showPage('overview');
</script></body></html>
